{% extends 'base.html' %}
{% block title %}კატეგორიების მართვა | ადმინ{% endblock %}

{% block content %}
<div class="admin-page">
<div class="container" style="max-width:640px;">

    <a href="{{ url_for('admin_dashboard') }}" style="display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-muted);text-decoration:none;margin-bottom:28px;transition:color 0.2s;"
       onmouseover="this.style.color='var(--accent-hover)'" onmouseout="this.style.color='var(--text-muted)'">
        <i class="fa-solid fa-arrow-left"></i> მართვის პანელზე დაბრუნება
    </a>

    <div class="surface" style="padding:36px;">
        <h1 style="font-size:20px;font-weight:800;color:var(--text-primary);margin-bottom:6px;display:flex;align-items:center;gap:10px;">
            <i class="fa-solid fa-tags" style="color:var(--accent-hover);"></i> კატეგორიების მართვა
        </h1>
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:28px;">დაამატეთ ახალი კატეგორიები, ან ნახეთ არსებული სია.</p>

        <!-- Add form -->
        <form action="{{ url_for('admin_categories') }}" method="POST" style="display:flex;gap:10px;margin-bottom:28px;">
            <input type="text" name="name" required placeholder="ახალი კატეგორიის სახელი..." class="form-input">
            <button type="submit" class="btn btn-primary" style="white-space:nowrap;">
                <i class="fa-solid fa-plus"></i> დამატება
            </button>
        </form>

        <!-- List -->
        <div style="display:flex;flex-direction:column;gap:8px;">
            {% for cat in categories %}
            <div class="elevated" style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:32px;height:32px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;color:var(--accent-hover);font-size:12px;">
                        <i class="fa-solid fa-tag"></i>
                    </div>
                    <span style="font-size:13px;font-weight:700;color:var(--text-primary);">{{ cat.name }}</span>
                </div>
                <span style="font-size:10px;color:var(--text-muted);font-family:monospace;">{{ cat.slug }}</span>
            </div>
            {% endfor %}
        </div>

    </div>
</div>
</div>
{% endblock %}
